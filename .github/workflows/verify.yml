name: Firmware verification
on:
  push:
    branches: [fall26-development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    container: gcc:14.2.0@sha256:b99b86a28812b1e6453a231a947dc43d76fe192788a12f344a9b568bf9f5d24c
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tool version
        run: g++ --version
      - name: Host tests
        run: ./tests/run_tests.sh
      - name: ASan and UBSan
        run: SANITIZE=1 ./tests/run_tests.sh
      - name: Whitespace since reviewed starting revision
        run: git -c safe.directory="$GITHUB_WORKSPACE" diff --check 3fa818db2e62f5d08bb78fadfa861dc6b18c0f4f HEAD

  uno:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        build: [default, experimental, uart-rejection]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.5.1'
      - name: Install pinned Uno dependencies
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install Servo@1.2.2
          arduino-cli version
          arduino-cli core list
          arduino-cli lib list
      - name: Compile or check expected conflict
        run: ./tools/check_uno.sh ${{ matrix.build }}
